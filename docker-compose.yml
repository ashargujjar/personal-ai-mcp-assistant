services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus_ai
      REDIS_URL: redis://redis:6379
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  python:
    build:
      context: ./fastapi
      dockerfile: dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus_ai
    ports:
      - "8000:8000"
    depends_on:
      - backend
      - postgres
    volumes:
      - ./fastapi:/app

  mcp-server:
    build:
      context: ./mcp
      dockerfile: dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8000"
    depends_on:
      - backend
    volumes:
      - ./mcp:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  ingestion-worker:
    build:
      context: ./fastapi
      dockerfile: dockerfile
    restart: unless-stopped
    command:
      - celery
      - -A
      - ingestion.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=1
      - --queues=ingestion
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus_ai

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./fastapi:/app
  ingestion-dispatcher:
    build:
      context: ./fastapi
      dockerfile: dockerfile
    restart: unless-stopped
    command:
      - python
      - -m
      - ingestion.dispatcher
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus_ai
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./fastapi:/app
  resume-worker:
    build:
      context: ./backend
      dockerfile: dockerfile
    restart: unless-stopped
    command: npm run worker:resume
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus_ai
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
  resume-attachment-worker:
    build:
      context: ./backend
      dockerfile: dockerfile
    restart: unless-stopped
    command: npm run worker:resume-attachment
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus_ai
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
  resume-pdf-deletion-worker:
    build:
      context: ./backend
      dockerfile: dockerfile
    restart: unless-stopped
    command: npm run worker:resume-pdf-deletion
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus_ai
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  postgres-data:
  redis-data:
